services:
    postgres_db:
        image: postgres:16-alpine
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        ports:
            - "${POSTGRES_PORT}:5432"
        volumes:
            - ./pgdata:/var/lib/postgresql/data
            - ./migrations:/docker-entrypoint-initdb.d:ro

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 5s
    
    redis:
        image: redis:7
        ports:
            - "${REDIS_PORT}:6379"
        volumes:
            - ./redis:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 5s

    minio:
        image: minio/minio:latest
        command: server /data --console-address ":9001"
        ports:
            - "${MINIO_PORT}:9000"
            - "9001:9001"
        volumes:
            - ./minio:/data
        environment:
            - MINIO_ROOT_USER=${MINIO_ROOT_USER}
            - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
        healthcheck:
            test: ["CMD", "mc", "ready", "local"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 5s

    api:
      build: ./services/api
      depends_on:
        postgres_db:
          condition: service_healthy
        redis:
          condition: service_healthy
        minio:
          condition: service_healthy
      env_file:
        - .env
      ports:
        - "${API_PORT}:8080"
      volumes:
        - ./services/api:/app/src
      healthcheck:
       test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/v1/health > /dev/null || exit 1"]
       interval: 5s
       timeout: 5s
       retries: 5
       start_period: 5s


    worker:
      build:
        context: ./services/worker
        network: host
      image: doc-intel-worker
      restart: always
      env_file:
        - .env
      depends_on:
        postgres_db:
          condition: service_healthy
        redis:
          condition: service_healthy
        minio:
          condition: service_healthy

    web:
      build:
        context: ./services/web
      restart: always
      ports:
        - "3000:3000"
      environment:
        - NEXT_PUBLIC_API_URL=http://localhost:8080/v1
      depends_on:
        - api